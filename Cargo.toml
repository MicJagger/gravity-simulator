[package]
name = "gravity-simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.2"
env_logger = "0.11.11"
itertools = "0.15.0"
ordered_hash_map = "0.6.1"
pollster = "1.0.2"
sdl3 = { version = "0.22.1", features = ["build-from-source-static", "raw-window-handle"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spin_sleep = "1.3.3"
wgpu = "30.0.2"
